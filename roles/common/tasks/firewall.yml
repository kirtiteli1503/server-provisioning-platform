---
# Allow rules first, then flip the default policy and enable.
- name: Allow required inbound traffic
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ common_ufw_rules + common_ufw_extra_rules }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Default deny inbound
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outbound
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
